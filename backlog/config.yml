project_name: "Game Studio"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
# Draft (native) is used for pre-ready story authoring. Ready/Blocked/In Review from
# the old template map onto native statuses + labels (see WORKFLOW-GUIDE.md § Status model).
labels: ["blocked", "bug"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
